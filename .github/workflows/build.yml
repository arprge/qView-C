name: Build qView

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: 'ubuntu-22.04'
            qtVersion: '5.15.2'
            artifactName: 'qView-linux-appimage'
            artifactPath: 'bin/*.AppImage'
          - runner: 'macos-15'
            qtVersion: '6.8.3'
            qtModules: 'qtimageformats'
            buildArch: 'Universal'
            artifactName: 'qView-macos'
            artifactPath: 'bin/*.dmg'
            # macOS runners are capacity-constrained ("job was not acquired");
            # don't let a missing macOS runner block the whole release.
            optional: true
          - runner: 'windows-2022'
            qtVersion: '6.8.3'
            qtArch: 'win64_msvc2022_64'
            qtModules: 'qtimageformats'
            artifactName: 'qView-windows-win64'
            artifactPath: 'bin'
          - runner: 'windows-2022'
            qtVersion: '6.8.3'
            qtArch: 'win64_msvc2022_arm64_cross_compiled'
            qtModules: 'qtimageformats'
            buildArch: 'Arm64'
            artifactName: 'qView-windows-winarm64'
            artifactPath: 'bin'
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 60
    steps:
      - name: Set environment variables
        shell: bash
        run: |
          echo "qtArch=${{ matrix.qtArch }}" >> $GITHUB_ENV
          echo "buildArch=${{ matrix.buildArch }}" >> $GITHUB_ENV

      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qtVersion }}
          arch: ${{ matrix.qtArch }}
          cache: true
          modules: ${{ matrix.qtModules }}

      - name: Build qView
        shell: pwsh
        run: dist/scripts/build.ps1 -CI

      - name: Deploy qView
        shell: pwsh
        run: |
          & dist/scripts/download-plugins.ps1
          if ($IsWindows) {
            & dist/scripts/windeployqt.ps1 -Portable
          } elseif ($IsMacOS) {
            & dist/scripts/macinstallcert.ps1
            bash dist/scripts/macdeploy.sh
          } else {
            bash dist/scripts/linuxdeployqt.sh
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}

  build-deb:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper cmake qtbase5-dev qtbase5-dev-tools qttools5-dev-tools libqt5svg5-dev libqt5x11extras5-dev libx11-dev

      - name: Build .deb package
        run: |
          cp -r dist/linux/debian debian
          dpkg-buildpackage -us -uc -b
          mkdir -p out
          mv ../qview-c_*.deb out/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: qView-deb
          path: out/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools cmake gcc-c++ qt6-qtbase-devel qt6-qtsvg-devel qt6-qttools-devel libX11-devel tar gzip

      - name: Build .rpm package
        run: |
          rpmdev-setuptree
          VERSION=$(grep -m1 '^Version:' dist/linux/rpm/qview.spec | awk '{print $2}')
          tar --exclude=.git --exclude=out -czf ~/rpmbuild/SOURCES/qview-c-${VERSION}.tar.gz --transform "s,^\.,qview-c-${VERSION}," .
          rpmbuild -bb dist/linux/rpm/qview.spec
          mkdir -p out
          cp ~/rpmbuild/RPMS/*/*.rpm out/

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v6
        with:
          name: qView-rpm
          path: out/*.rpm

  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake qt6-base qt6-svg qt6-imageformats qt6-tools libx11 hicolor-icon-theme tar gzip

      - name: Build .pkg.tar.zst package
        run: |
          useradd -m builder
          WORKDIR=/tmp/archbuild
          mkdir -p "$WORKDIR"
          cp dist/linux/arch/PKGBUILD "$WORKDIR/"
          PKGVER=$(grep -m1 '^pkgver=' dist/linux/arch/PKGBUILD | cut -d= -f2)
          tar --exclude=.git --exclude=out -czf "$WORKDIR/qview-c-${PKGVER}.tar.gz" --transform "s,^\.,qview-c-${PKGVER}," .
          chown -R builder:builder "$WORKDIR"
          su - builder -c "cd $WORKDIR && makepkg -f --noconfirm"
          mkdir -p out
          cp "$WORKDIR"/*.pkg.tar.zst out/

      - name: Upload .pkg.tar.zst artifact
        uses: actions/upload-artifact@v6
        with:
          name: qView-arch
          path: out/*.pkg.tar.zst

  release:
    needs: [build, build-deb, build-rpm, build-arch]
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Read version from CMakeLists.txt
        id: ver
        run: |
          VERSION=$(sed -n 's/^project(qView VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_files
          VERSION="${{ steps.ver.outputs.version }}"
          cp artifacts/qView-linux-appimage/*.AppImage "release_files/qView-C-${VERSION}-x86_64.AppImage"
          if [ -d artifacts/qView-macos ]; then
            cp artifacts/qView-macos/*.dmg "release_files/qView-C-${VERSION}-macos.dmg"
          else
            echo "::warning::macOS artifact missing, publishing release without it"
          fi
          cp artifacts/qView-deb/*.deb "release_files/qView-C-${VERSION}-amd64.deb"
          cp artifacts/qView-rpm/*.rpm "release_files/qView-C-${VERSION}-x86_64.rpm"
          cp artifacts/qView-arch/*.pkg.tar.zst "release_files/qView-C-${VERSION}-x86_64.pkg.tar.zst"
          (cd artifacts/qView-windows-win64 && zip -r "../../release_files/qView-C-${VERSION}-win64.zip" .)
          (cd artifacts/qView-windows-winarm64 && zip -r "../../release_files/qView-C-${VERSION}-winarm64.zip" .)
          ls -lh release_files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: qView-C ${{ steps.ver.outputs.version }}
          prerelease: false
          body: "Release build of qView-C ${{ steps.ver.outputs.version }}: qView with built-in image editing."
          files: release_files/*
