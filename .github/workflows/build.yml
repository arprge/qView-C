name: Build qView
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      isRelease:
        type: boolean
        description: 'Is this a release build?'
        required: false
        default: false
      appleNotarize:
        type: boolean
        description: 'Notarize with Apple?'
        required: false
        default: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: 'ubuntu-22.04'
            qtVersion: '5.15.2'
          - runner: 'macos-15'
            qtVersion: '6.8.3'
            qtModules: 'qtimageformats'
            buildArch: 'Universal'
          - runner: 'macos-15'
            qtVersion: '5.15.2'
            osSuffix: '_legacy'
            buildArch: 'X64'
          - runner: 'windows-2022'
            qtVersion: '6.8.3'
            qtArch: 'win64_msvc2022_64'
            osSuffix: '_64'
            qtModules: 'qtimageformats'
          - runner: 'windows-2022'
            qtVersion: '6.8.3'
            qtArch: 'win64_msvc2022_arm64_cross_compiled'
            osSuffix: '_arm64'
            qtModules: 'qtimageformats'
            buildArch: 'Arm64'
          - runner: 'windows-2022'
            qtVersion: '5.15.2'
            qtArch: 'win32_msvc2019'
            osSuffix: '_32'
            buildArch: 'X86'
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set environment variables
        shell: bash
        run: |
          echo "qtArch=${{ matrix.qtArch }}" >> $GITHUB_ENV
          echo "buildArch=${{ matrix.buildArch }}" >> $GITHUB_ENV
          if [ "${{ inputs.isRelease }}" != "true" ] && [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            buildNum=$(date '+%Y-%m-%d').$GITHUB_RUN_ATTEMPT
            echo "nightlyDefines=NIGHTLY=$buildNum" >> $GITHUB_ENV
            echo "nightlyString=-nightly" >> $GITHUB_ENV
            echo "buildNumString=$buildNum" >> $GITHUB_ENV
            echo "buildNumSuffix=-$buildNum" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qtVersion }}
          arch: ${{ matrix.qtArch }}
          cache: true
          modules: ${{ matrix.qtModules }}

      - name: Build qView
        shell: pwsh
        run: dist/scripts/build.ps1 -CI

      - name: Deploy qView
        env:
          APPLE_NOTARIZE_REQUESTED: ${{ inputs.appleNotarize }}
          APPLE_DEVID_APP_CERT_DATA: ${{ secrets.APPLE_DEVID_APP_CERT_DATA }}
          APPLE_DEVID_APP_CERT_PASS: ${{ secrets.APPLE_DEVID_APP_CERT_PASS }}
          APPLE_ID_USER: ${{ secrets.APPLE_ID_USER }}
          APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
        shell: pwsh
        run: |
          if ("${{ matrix.skipPlugins }}" -ne "true") {
            & dist/scripts/download-plugins.ps1
          }
          if ($IsWindows) {
            & dist/scripts/windeployqt.ps1 ${{ env.buildNumString }}
          } elseif ($IsMacOS) {
            & dist/scripts/macinstallcert.ps1
            bash dist/scripts/macdeploy.sh ${{ env.buildNumString }}
          } else {
            bash dist/scripts/linuxdeployqt.sh ${{ env.buildNumString }}
          }

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: qView${{ env.nightlyString }}-${{ runner.os }}${{ matrix.osSuffix }}${{ env.buildNumSuffix }}
          path: bin

  build-deb:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper cmake qtbase5-dev qtbase5-dev-tools qttools5-dev-tools libqt5svg5-dev libqt5x11extras5-dev libx11-dev

      - name: Build .deb package
        run: |
          cp -r dist/linux/debian debian
          dpkg-buildpackage -us -uc -b
          mkdir -p out
          mv ../qview-c_*.deb out/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: qView-deb
          path: out/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools cmake gcc-c++ qt6-qtbase-devel qt6-qtsvg-devel qt6-qttools-devel libX11-devel tar gzip

      - name: Build .rpm package
        run: |
          rpmdev-setuptree
          VERSION=$(grep -m1 '^Version:' dist/linux/rpm/qview.spec | awk '{print $2}')
          tar --exclude=.git --exclude=out -czf ~/rpmbuild/SOURCES/qview-c-${VERSION}.tar.gz --transform "s,^\.,qview-c-${VERSION}," .
          rpmbuild -bb dist/linux/rpm/qview.spec
          mkdir -p out
          cp ~/rpmbuild/RPMS/*/*.rpm out/

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: qView-rpm
          path: out/*.rpm

  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake qt6-base qt6-svg qt6-imageformats qt6-tools libx11 hicolor-icon-theme tar gzip

      - name: Build .pkg.tar.zst package
        run: |
          useradd -m builder
          WORKDIR=/tmp/archbuild
          mkdir -p "$WORKDIR"
          cp dist/linux/arch/PKGBUILD "$WORKDIR/"
          PKGVER=$(grep -m1 '^pkgver=' dist/linux/arch/PKGBUILD | cut -d= -f2)
          tar --exclude=.git --exclude=out -czf "$WORKDIR/qview-c-${PKGVER}.tar.gz" --transform "s,^\.,qview-c-${PKGVER}," .
          chown -R builder:builder "$WORKDIR"
          su - builder -c "cd $WORKDIR && makepkg -f --noconfirm"
          mkdir -p out
          cp "$WORKDIR"/*.pkg.tar.zst out/

      - name: Upload .pkg.tar.zst artifact
        uses: actions/upload-artifact@v4
        with:
          name: qView-arch
          path: out/*.pkg.tar.zst

  nightly-release:
    needs: [build, build-deb, build-rpm, build-arch]
    if: github.ref_name == 'main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: ls -l artifacts/

      - name: Package artifacts for release
        run: |
          mkdir release_files
          cd artifacts
          for dir in */; do
            name=$(basename "$dir")
            if [[ "$name" == "qView-deb" || "$name" == "qView-rpm" || "$name" == "qView-arch" || "$name" == qView*-Linux* ]]; then
              cp "$dir"* ../release_files/
            else
              zip -r "../release_files/$name.zip" "$dir"
            fi
          done
          cd ..
          ls -l release_files/

      - name: Update "Nightly" Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: "qView Nightly"
          prerelease: true
          body: |
            Latest automatic build from the main branch. Might be broken.

          files: release_files/*
