name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin the runner image: ubuntu-latest silently moved to 26.04, which changed the
# clang-format version and broke install-qt-action's apt step (amd64v3 mirror errors).
jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8'
          cache: true
          modules: 'qtimageformats'

      - name: Configure CMake
        run: cmake -B build -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --target actionmanagertests --parallel 2

      - name: Run tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" ctest --test-dir build --output-on-failure

  clang-tidy:
    name: Run clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8'
          cache: true
          modules: 'qtimageformats'

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Run clang-tidy
        run: ./build.sh --tidy

  format:
    name: Run clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Pinned via PyPI so CI and local runs use the exact same formatter.
      # Locally: pip install clang-format==21.1.6
      - name: Install clang-format
        run: pipx install clang-format==21.1.6

      - name: Run clang-format
        run: |
          clang-format --version
          ./build.sh --format-check
